# Runs on every push and pull request: tests, frontend type check, and a
# Linux desktop build. Pushes to the release branch are skipped because
# release.yml runs the same checks there before packaging (deb/rpm/dmg).
name: CI

on:
  push:
    branches-ignore: [release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Go tests
        run: go test -race ./...
      - name: Frontend type check and unit tests
        working-directory: frontend
        run: |
          npm run check
          npm test

  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install GTK and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
        working-directory: frontend
      - name: Build desktop binary
        run: make gui-build
